name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint (strict on extracted modules; legacy files parse-level)
        run: npm run lint
      - name: Type-check @ts-check modules
        run: npm run typecheck
      - name: Run test suite
        run: npm test
        env:
          # npm test's pretest hook builds the generated renderer bundle
          # (app.js) from src/renderer/app.js. Includes the plugin pipeline
          # drift guard (tests/plugins/axes-drift.test.js) — a PR that edits
          # plugins/*.axe or the FALLBACK block without updating plugins-src
          # (or vice versa) fails here.
          CI: true
