name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint (strict on extracted modules; legacy files parse-level)
        run: npm run lint
      - name: Type-check @ts-check modules
        run: npm run typecheck
      - name: Fetch base branch for the plugin version gate
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=1
      - name: Plugin version-bump gate
        if: github.event_name == 'pull_request'
        # parachord#1099: replaces the local build-axes content-vs-disk
        # comparison, which went silent when plugins/*.axe were untracked.
        # Any PR that touches plugins-src/<id>/ must bump that plugin's
        # manifest.version or marketplace clients never re-download it.
        run: node scripts/check-plugin-version-bumps.js FETCH_HEAD
      - name: Run test suite
        run: npm test
        env:
          # npm test's pretest hook (build-axes BEFORE build-renderer) builds
          # the generated plugin artifacts and the renderer bundle
          # (app.js) from their sources. Drift is checked by the step below,
          # not a test: a tracked artifact cannot drift when it isn't
          # tracked, and a --check run AFTER pretest's writer cannot fail
          # (the writer has already regenerated everything on disk).
          CI: true
      - name: Generated outputs are committed (plugin drift gate)
        # tests/plugins/axes-drift.test.js replacement: the writer must be a
        # no-op against what the PR committed. A PR that edits plugins-src/
        # without committing the regenerated marketplace-manifest versions
        # fails here. (The FALLBACK half of the old remit moved to bucket C:
        # the array now lives in a gitignored generated module, byte-compared
        # by `build-axes --check` against plugins-src, so it can no longer
        # drift against what the PR committed — it isn't tracked at all.)
        run: |
          if ! git diff --exit-code -- marketplace-manifest.json amazon-player-preload.js; then
            echo "::error::a generator rewrote a committed file — run 'node scripts/build-axes.js' (+ 'node scripts/build-amazon-preload.js' for the Amazon preload) and commit"
            exit 1
          fi
